<script src="vendor/three.bundle.js"></script>

<script>
/* One copper trace — a 15 s launch film for hankhsu.com.
 * One board, world units in millimetres (x right, z toward the viewer, y up). A copper trace leaves the period of
 * "Hsu Hsin-Wei.", routes through each build's real PCB layout, each board rises into its product, and the trace
 * comes home as the h logo and the wordmark. Every value is a function of t; __seek(t) is pure. */
const { clamp, lerp, seg, sstep, spring, ring, ease } = OM;
const Q = new URLSearchParams(location.search);
const W = 1920, H = 1080, DUR = 15;
const ACC = FILM_MODELS.ACCENT;
const COPPER = '#D89E64', LOGO_ORANGE = '#F7931E', LOGO_YELLOW = '#FFE21F';

// ─────────────────────────────── timeline ───────────────────────────────
const T = {
  padOn: 0.15, aStart: 0.70, aEnd: 1.95,
  aurRise: 2.24, aurBoot: 2.52, aurEyes: 2.82, aurBlink: 3.70, aurGlance: 3.90,
  bStart: 4.06, bEnd: 4.84,
  lrRise: 5.08, drive0: 6.04, drive1: 7.40,
  bus0: 7.42, busV: 1420, busC: 0.11,
  l4Start: 10.24, logoFill: 0.40, wordDur: 0.68,
};

// ─────────────────────────────── layout (mm) ───────────────────────────────
const AUR = { x: 430, z: -190, w: 74.041, h: 85.5218 };
const LR = { x: 70, z: -205, w: 124.9934, h: 74.803 };
const HXK = { x: -400, z: 205, w: 76.2762, h: 96.3676 };
const CL = { x: -20, z: 222, w: 132, h: 58 };
const ARX = { x: 320, z: 212, w: 128, h: 96 };
const JX = -330;                                  // where the buggy brakes; the bus leaves from under it
const FONT_MM = 74, BASE_Z = 26;                  // wordmark size and baseline
let LOCK;                                         // measured in __ready: logo + wordmark + period pad

// ─────────────────────────────── renderer ───────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.clippingPlanes = [new THREE.Plane(new THREE.Vector3(0, 1, 0), 0.02)];   // products rise through the board
const scene = new THREE.Scene(); scene.background = new THREE.Color('#060607');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new THREEX.RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.9;
const camera = new THREE.PerspectiveCamera(30, W / H, 4, 20000);
scene.add(new THREE.AmbientLight('#ffffff', 0.55));
const key = new THREE.DirectionalLight('#fff7ec', 1.35);
key.position.set(-380, 900, 520); key.target.position.set(0, 0, 0); scene.add(key, key.target);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.6;
Object.assign(key.shadow.camera, { left: -760, right: 760, top: 560, bottom: -560, near: 100, far: 2600 }); key.shadow.camera.updateProjectionMatrix();
const headLight = new THREE.PointLight(COPPER, 0, 230, 0); headLight.position.y = 26; scene.add(headLight);

// ─────────────────────────────── the board ───────────────────────────────
// Dark solder mask with a via grid every 20 mm — something for the camera to slide against.
const board = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.ShaderMaterial({
  toneMapped: false,
  vertexShader: `varying vec2 vP; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vP = w.xz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `varying vec2 vP;
    void main(){
      vec2 g = mod(vP + 10.0, 20.0) - 10.0; float d = length(g); float fw = fwidth(d) * 1.2;
      float dotA = 1.0 - smoothstep(0.85 - fw, 0.85 + fw, d);
      float fade = clamp(1.6 - fwidth(vP.x) * 1.4, 0.0, 1.0);          // vias fade where they would alias
      float ringA = (1.0 - smoothstep(0.3 - fw, 0.3 + fw, d));
      vec3 base = vec3(0.034, 0.037, 0.038), via = vec3(0.085, 0.088, 0.088);
      vec3 c = mix(base, via, dotA * fade * 0.9); c = mix(c, base * 0.7, ringA * fade);
      gl_FragColor = vec4(c, 1.0); }`,
}));
board.rotation.x = -Math.PI / 2; scene.add(board);
const shadowCatch = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.ShadowMaterial({ opacity: 0.55 }));
shadowCatch.rotation.x = -Math.PI / 2; shadowCatch.position.y = 0.04; shadowCatch.receiveShadow = true; scene.add(shadowCatch);

// ─────────────────────────────── reveal planes ───────────────────────────────
// Two textures on one plane: the dim version everywhere, the lit one inside a radius from an origin (mode 0) or left
// of a moving x (mode 1), with a bright front. Used for the PCBs, the logo and the wordmark. Textures stay raw sRGB.
const REVEAL_FS = `uniform sampler2D tDim, tLit; uniform vec2 uSize, uOrigin; uniform float uR, uW, uMode, uDim, uFront, uAlpha; uniform vec3 uTint;
  varying vec2 vUv;
  void main(){
    vec2 p = vUv * uSize; vec4 a = texture2D(tDim, vUv); vec4 b = texture2D(tLit, vUv);
    float d = uMode < 0.5 ? length(p - uOrigin) : (p.x - uOrigin.x);
    float m = 1.0 - smoothstep(uR - uW, uR, d);
    float front = exp(-pow((d - uR + uW * 0.5) / (uW * 0.6), 2.0)) * uFront * step(0.001, uR);
    vec4 c = mix(vec4(a.rgb, a.a * uDim), b, m);
    c.rgb += uTint * front * max(a.a, b.a) * 1.2; c.a = max(c.a, max(a.a, b.a) * front * 0.9);
    gl_FragColor = vec4(c.rgb, c.a * uAlpha); }`;
function revealPlane(dim, lit, wmm, hmm, tint) {
  const tex = c => { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.NoColorSpace; t.anisotropy = 8; t.generateMipmaps = true; t.minFilter = THREE.LinearMipmapLinearFilter; return t; };
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, toneMapped: false,
    uniforms: { tDim: { value: tex(dim) }, tLit: { value: tex(lit) }, uSize: { value: new THREE.Vector2(wmm, hmm) },
      uOrigin: { value: new THREE.Vector2() }, uR: { value: 0 }, uW: { value: 10 }, uMode: { value: 0 }, uDim: { value: 1 },
      uFront: { value: 1 }, uAlpha: { value: 1 }, uTint: { value: new THREE.Color(tint || '#ffffff') } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = vec2(uv.x, uv.y); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: REVEAL_FS,
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(wmm, hmm), mat);
  m.rotation.x = -Math.PI / 2;
  // uv (0,0) is the plane's bottom-left as drawn; with the −90° tilt that is (−w/2, +h/2) on the board.
  m.toLocal = (bx, bz) => [bx - (m.position.x - wmm / 2), (m.position.z + hmm / 2) - bz];
  m.renderOrder = 1;
  return m;
}
const canvasOf = (w, h) => { const c = document.createElement('canvas'); c.width = Math.round(w); c.height = Math.round(h); return c; };
async function svgCanvas(svg, w, h) {
  const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); await img.decode();
  const c = canvasOf(w, h); c.getContext('2d').drawImage(img, 0, 0, w, h); return c;
}
const recolor = (svg, map) => Object.entries(map).reduce((s, [a, b]) => s.split(a).join(b).split(a.toLowerCase()).join(b), svg);
const mixHex = (a, b, k) => '#' + new THREE.Color(a).lerp(new THREE.Color(b), k).getHexString();

// A KiCad layout → dim (unpowered copper) and lit (the project's accent) versions.
async function pcbPlane(name, spec, accent) {
  const svg = ASSETS.svg[name], PX = 16;
  const dim = recolor(svg, { '#C83434': '#4a3523', '#4D7FC4': '#2f241a', '#FFFFFF': '#0b0c0c', '#F2EDA1': '#5d5a54', '#C2C2C2': '#3b3936', '#D0D2CD': '#3b3936' });
  const lit = recolor(svg, { '#C83434': accent, '#4D7FC4': mixHex(accent, '#0b0c0c', 0.45), '#FFFFFF': '#0b0c0c', '#F2EDA1': '#ece8df', '#C2C2C2': '#8f8a82', '#D0D2CD': '#8f8a82' });
  const p = revealPlane(await svgCanvas(dim, spec.w * PX, spec.h * PX), await svgCanvas(lit, spec.w * PX, spec.h * PX), spec.w, spec.h, accent);
  p.position.set(spec.x, 0.08, spec.z); scene.add(p); return p;
}
// CoreLink and Arx have no exported layout: a footprint drawn in the same KiCad grammar.
function footprintPlane(spec, accent, kind) {
  const PX = 16, w = spec.w * PX, h = spec.h * PX;
  const draw = (c, col) => {
    const g = c.getContext('2d'), u = PX;
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.strokeStyle = col.edge; g.lineWidth = 0.25 * u; g.strokeRect(1 * u, 1 * u, w - 2 * u, h - 2 * u);
    g.strokeStyle = col.cu; g.fillStyle = col.cu; g.lineWidth = 0.9 * u;
    const pad = (x, y, r = 0.95) => { g.beginPath(); g.arc(x * u, y * u, r * u, 0, 7); g.fill(); g.fillStyle = col.hole; g.beginPath(); g.arc(x * u, y * u, 0.42 * u, 0, 7); g.fill(); g.fillStyle = col.cu; };
    const line = pts => { g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x * u, y * u) : g.moveTo(x * u, y * u))); g.stroke(); };
    const W2 = spec.w, H2 = spec.h;
    if (kind === 'corelink') {
      for (let i = 0; i < 14; i++) { pad(16 + i * 2.54 * 2, 10); pad(16 + i * 2.54 * 2, 48); }
      g.strokeStyle = col.cu2; g.lineWidth = 0.6 * u;
      for (let i = 0; i < 14; i += 2) line([[16 + i * 5.08, 10], [16 + i * 5.08, 18], [26 + i * 5.08, 28], [26 + i * 5.08, 38], [16 + i * 5.08, 48]]);
      g.strokeStyle = col.cu; g.lineWidth = 0.9 * u;
      line([[W2 / 2, 1], [W2 / 2, 6], [16 + 6 * 5.08, 10]]);
      g.strokeStyle = col.silk; g.lineWidth = 0.3 * u; g.strokeRect(10 * u, 6 * u, (W2 - 20) * u, (H2 - 12) * u);
      g.beginPath(); g.arc(30 * u, 29 * u, 9 * u, 0, 7); g.stroke(); g.beginPath(); g.arc((W2 - 30) * u, 29 * u, 9 * u, 0, 7); g.stroke();
    } else {
      const cx = W2 / 2, cy = H2 / 2, mx = 35.4;
      g.strokeStyle = col.silk; g.lineWidth = 0.3 * u;
      for (const [sx, sy] of [[1, 1], [-1, -1], [1, -1], [-1, 1]]) { g.beginPath(); g.arc((cx + sx * mx) * u, (cy + sy * mx * 0.82) * u, 17 * u, 0, 7); g.stroke(); }
      g.strokeRect((cx - 14) * u, (cy - 14) * u, 28 * u, 28 * u);
      g.strokeStyle = col.cu; g.lineWidth = 0.9 * u;
      for (const [sx, sy] of [[1, 1], [-1, -1], [1, -1], [-1, 1]]) { line([[cx + sx * 10, cy + sy * 10], [cx + sx * mx * 0.7, cy + sy * mx * 0.58]]); pad(cx + sx * mx, cy + sy * mx * 0.82, 1.6); }
      line([[cx, 1], [cx, cy - 14]]);
      for (let i = 0; i < 7; i++) { pad(cx - 7.6 + i * 2.54, cy + 16.5, 0.8); pad(cx - 7.6 + i * 2.54, cy - 16.5, 0.8); }
    }
  };
  const dim = canvasOf(w, h), lit = canvasOf(w, h);
  draw(dim, { edge: '#3b3936', cu: '#4a3523', cu2: '#2f241a', hole: '#0b0c0c', silk: '#5d5a54' });
  draw(lit, { edge: '#8f8a82', cu: accent, cu2: mixHex(accent, '#0b0c0c', 0.45), hole: '#0b0c0c', silk: '#ece8df' });
  const p = revealPlane(dim, lit, spec.w, spec.h, accent);
  p.position.set(spec.x, 0.08, spec.z); scene.add(p); return p;
}
// Silkscreen text on the board (designators, wordmark, tagline): a canvas per string, dim and lit.
function textPlane(str, font, mmPx, dimCol, litCol, tint, opts = {}) {
  const PX = opts.px || 10, probe = canvasOf(8, 8).getContext('2d'); probe.font = font(mmPx * PX);
  const m = probe.measureText(str), pad = 4 * PX;
  const w = Math.ceil(m.width + pad * 2), asc = Math.ceil(m.actualBoundingBoxAscent), desc = Math.ceil(m.actualBoundingBoxDescent);
  const h = asc + desc + pad * 2;
  const mk = col => { const c = canvasOf(w, h), g = c.getContext('2d'); g.font = font(mmPx * PX); g.fillStyle = col; g.textBaseline = 'alphabetic'; g.fillText(str, pad, pad + asc); return c; };
  const p = revealPlane(mk(dimCol), mk(litCol), w / PX, h / PX, tint);
  p.textW = m.width / PX; p.pad = pad / PX; p.asc = asc / PX;
  // place by the text's own left baseline
  p.placeAt = (x, z) => p.position.set(x - p.pad + w / PX / 2, 0.09, z - (p.pad + p.asc) + h / PX / 2);
  return p;
}

// ─────────────────────────────── traces ───────────────────────────────
// A route is corner points plus a fillet radius per corner, sampled every 0.6 mm; drawn as a ribbon whose drawRange
// is the revealed length, with a soft additive halo and a vertex-colour gradient along it.
function route(pts, radii) {
  const P = pts.map(([x, z]) => new THREE.Vector2(x, z)), out = [P[0].clone()];
  const arcTo = (A, B, c, r) => {
    let a0 = Math.atan2(A.y - c.y, A.x - c.x), a1 = Math.atan2(B.y - c.y, B.x - c.x), da = a1 - a0;
    while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
    const n = Math.max(2, Math.ceil(Math.abs(da) * r / 0.6));
    for (let i = 1; i <= n; i++) { const a = a0 + da * i / n; out.push(new THREE.Vector2(c.x + r * Math.cos(a), c.y + r * Math.sin(a))); }
  };
  const lineTo = B => { const A = out[out.length - 1], L = A.distanceTo(B), n = Math.max(1, Math.ceil(L / 0.6)); for (let i = 1; i <= n; i++) out.push(A.clone().lerp(B, i / n)); };
  for (let i = 1; i < P.length - 1; i++) {
    const u = P[i].clone().sub(P[i - 1]).normalize(), v = P[i + 1].clone().sub(P[i]).normalize();
    const turn = Math.acos(clamp(u.dot(v), -1, 1)), r = (Array.isArray(radii) ? radii[i - 1] : radii) || 0;
    if (turn < 1e-3 || r <= 0) { lineTo(P[i]); continue; }
    const td = r * Math.tan(turn / 2), A = P[i].clone().addScaledVector(u, -td), B = P[i].clone().addScaledVector(v, td);
    const cross = u.x * v.y - u.y * v.x, perp = new THREE.Vector2(-u.y, u.x).multiplyScalar(cross > 0 ? r : -r);
    lineTo(A); arcTo(A, B, A.clone().add(perp), r);
  }
  lineTo(P[P.length - 1]);
  const cum = [0]; for (let i = 1; i < out.length; i++) cum.push(cum[i - 1] + out[i].distanceTo(out[i - 1]));
  return { pts: out, cum, L: cum[cum.length - 1] };
}
function at(R, s) {
  s = clamp(s, 0, R.L); let lo = 0, hi = R.cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (R.cum[m] <= s) lo = m; else hi = m; }
  const k = (s - R.cum[lo]) / Math.max(1e-6, R.cum[hi] - R.cum[lo]);
  return { x: lerp(R.pts[lo].x, R.pts[hi].x, k), z: lerp(R.pts[lo].y, R.pts[hi].y, k), i: lo };
}
function ribbon(R, width, colorAt, { y = 0.14, halo = 7.5, haloOp = 0.2 } = {}) {
  const n = R.pts.length, mk = (w) => {
    const pos = new Float32Array(n * 6), col = new Float32Array(n * 6), idx = [];
    for (let i = 0; i < n; i++) {
      const a = R.pts[Math.max(0, i - 1)], b = R.pts[Math.min(n - 1, i + 1)];
      let tx = b.x - a.x, tz = b.y - a.y; const l = Math.hypot(tx, tz) || 1; tx /= l; tz /= l;
      const nx = -tz * w / 2, nz = tx * w / 2, p = R.pts[i], c = colorAt(R.cum[i] / R.L);
      pos.set([p.x + nx, y, p.y + nz, p.x - nx, y, p.y - nz], i * 6); col.set([c.r, c.g, c.b, c.r, c.g, c.b], i * 6);
      if (i < n - 1) idx.push(2 * i, 2 * i + 1, 2 * i + 2, 2 * i + 1, 2 * i + 3, 2 * i + 2);
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.setIndex(idx); return g;
  };
  const core = new THREE.Mesh(mk(width), new THREE.MeshBasicMaterial({ vertexColors: true, toneMapped: false, transparent: true, depthWrite: false, side: THREE.DoubleSide }));
  const glow = new THREE.Mesh(mk(halo), new THREE.MeshBasicMaterial({ vertexColors: true, toneMapped: false, transparent: true, opacity: haloOp, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  core.renderOrder = 3; glow.renderOrder = 2; glow.position.y = -0.02;
  scene.add(glow, core);
  return { R, core, glow, set(s0, s1) {
    const i0 = s1 <= s0 ? 0 : at(R, s0).i, i1 = s1 <= s0 ? 0 : Math.min(n - 1, at(R, s1).i + 1), c = Math.max(0, i1 - i0) * 6;
    core.geometry.setDrawRange(i0 * 6, c); glow.geometry.setDrawRange(i0 * 6, c); core.visible = glow.visible = c > 0;
  } };
}
const gradient = (...stops) => k => {
  const n = stops.length - 1, i = Math.min(n - 1, Math.floor(k * n)), f = k * n - i;
  return new THREE.Color(stops[i]).lerp(new THREE.Color(stops[i + 1]), clamp(f));

// The current: an additive glow and a small light at the head of whichever trace is running.
const glowTex = (() => {
  const c = canvasOf(256, 256), g = c.getContext('2d'), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.12, 'rgba(255,255,255,0.85)'); gr.addColorStop(0.35, 'rgba(255,255,255,0.25)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256); const t = new THREE.CanvasTexture(c); return t;
})();
function decal(size, color, y = 0.06) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshBasicMaterial({ map: glowTex, color, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
  m.rotation.x = -Math.PI / 2; m.position.y = y; m.renderOrder = 4; scene.add(m); return m;
}
const heads = [0, 1, 2, 3].map(() => decal(30, COPPER, 0.3));

// ─────────────────────────────── build (in __ready) ───────────────────────────────
let M, PCB = {}, TXT = {}, TR = {}, POOL = {}, PAD, PADGLOW, LOGO, RINGS = [], BUSARR = [], DRIVE;
const LANES = [-12, -4, 4, 12];

function busLane(o, peel) {
  // left from under the braked buggy, down the board's left side, right under the wordmark, then peel off
  const zh = 125 - o, xv = -470 + o, pts = [[JX + 30, LR.z + o], [xv, LR.z + o], [xv, zh], [peel.x, zh], [peel.x, peel.z]];
  return route(pts, [40 - o, 40 - o, 10]);
}
const busS = tau => tau <= 0 ? 0 : T.busV * (tau - T.busC * (1 - Math.exp(-tau / T.busC)));   // soft start, then a steady race
function busT(s) { let lo = 0, hi = 5; for (let i = 0; i < 50; i++) { const m = (lo + hi) / 2; if (busS(m) < s) lo = m; else hi = m; } return hi; }

async function build() {
  await Promise.all([
    ['FilmDisplay', ASSETS.font.display, '200 800'], ['FilmMono', ASSETS.font.mono, '500'], ['FilmMono', ASSETS.font.mono6, '600'], ['FilmBody', ASSETS.font.body, '400 700'],
  ].map(async ([fam, b64, w]) => { const f = new FontFace(fam, Uint8Array.from(atob(b64), c => c.charCodeAt(0)), { weight: w }); await f.load(); document.fonts.add(f); }));

  // the lockup: [h] Hsu Hsin-Wei[.] — the period is the copper pad the film starts on
  const word = textPlane('Hsu Hsin-Wei', px => `800 ${px}px FilmDisplay`, FONT_MM, '#121212', '#f5f5f7', '#ffffff', { px: 8 });
  const logoH = FONT_MM * 1.0, logoW = logoH * 208.52 / 232.55, gap = FONT_MM * 0.34, padR = FONT_MM * 0.082;
  const lockW = logoW + gap + word.textW + FONT_MM * 0.3, x0 = -lockW / 2;
  LOCK = { logoX: x0, logoW, logoH, textX: x0 + logoW + gap, textW: word.textW };
  LOCK.P0 = { x: LOCK.textX + word.textW + FONT_MM * 0.15, z: BASE_Z - padR * 1.02, r: padR };
  LOCK.stemX = LOCK.logoX + logoW * 0.085;
  word.placeAt(LOCK.textX, BASE_Z); scene.add(word); TXT.word = word;
  word.material.uniforms.uMode.value = 1; word.material.uniforms.uW.value = 26; word.material.uniforms.uDim.value = 1;

function movers(t) {

  pts.push([buggyX(t), rise(t, T.lrRise, M.buggy.size.y, 0.74, 9) + 120, LR.z], [AUR.x, rise(t, T.aurRise, M.auraeyez.size.y) + 47, AUR.z],
    [HXK.x, rise(t, T.hxk + 0.03, M.hxkeysair.size.y, 0.55, 16) + 80, HXK.z], [CL.x, rise(t, T.cl + 0.03, M.corelink.size.y, 0.6, 14) + 104, CL.z],
    [ARX.x + 50, rise(t, T.arx + 0.03, M.arx.size.y, 0.6, 14) + arxLift(t) + 28, ARX.z]);
  return pts;
}
window.__motion = (t0, t1) => {
  const c0 = camAt(t0), c1 = camAt(t1), grid = [];
  for (const fx of [0.1, 0.5, 0.9]) for (const fy of [0.15, 0.5, 0.85]) {
    placeCamera(scratch, c0); const ray = new THREE.Raycaster(); ray.setFromCamera(new THREE.Vector2(fx * 2 - 1, 1 - fy * 2), scratch);
    const hit = new THREE.Vector3(); if (ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit)) grid.push([hit.x, 0, hit.z]);
  }
  let far = 0;
  const a = project(c0, grid), b = project(c1, grid); a.forEach((p, i) => { far = Math.max(far, Math.hypot(p[0] - b[i][0], p[1] - b[i][1])); });
  const m0 = movers(t0), m1 = movers(t1), n = Math.min(m0.length, m1.length);
  const pa = project(c0, m0.slice(0, n)), pb = project(c1, m1.slice(0, n));
  for (let i = 0; i < n; i++) if (Math.abs(pa[i][2]) < 1 && Math.abs(pb[i][2]) < 1) far = Math.max(far, Math.hypot(pa[i][0] - pb[i][0], pa[i][1] - pb[i][1]));
  if (t1 > T.arx && t0 < T.arx + 1.3) far = Math.max(far, 18 * Math.abs(propAngle(t1) - propAngle(t0)));   // prop tips
  return far;
};
window.__track = () => {
  // boxes on screen: each object's local box (cached once) through its current matrix, clipped to the frame,
  // dropped when behind the camera or off frame
  const box = (obj, op = 1) => {
    if (!obj.visible || op <= 0.01) return null;
    if (!obj.userData.lbox) { const inv = new THREE.Matrix4().copy(obj.matrixWorld).invert(), b = new THREE.Box3().setFromObject(obj); obj.userData.lbox = b.applyMatrix4(inv); }
    const lb = obj.userData.lbox, P = [];
    for (const x of [lb.min.x, lb.max.x]) for (const y of [lb.min.y, lb.max.y]) for (const z of [lb.min.z, lb.max.z]) {
      const v = new THREE.Vector3(x, y, z).applyMatrix4(obj.matrixWorld); v.y = Math.max(v.y, 0); v.project(camera);
      if (v.z < -1 || v.z > 1) return null; P.push([(v.x + 1) * W / 2, (1 - v.y) * H / 2]); }
    const x0 = Math.max(0, Math.min(...P.map(p => p[0]))), x1 = Math.min(W, Math.max(...P.map(p => p[0])));
    const y0 = Math.max(0, Math.min(...P.map(p => p[1]))), y1 = Math.min(H, Math.max(...P.map(p => p[1])));
    return x1 - x0 < 2 || y1 - y0 < 2 ? null : { x: x0, y: y0, w: x1 - x0, h: y1 - y0, op };
  };
  const out = {}, t = LAST_T, hs = headsAt(t);
  if (hs.length) { const [p] = project(camAt(t), [[hs[0].x, 0, hs[0].z]]); if (p[0] > -12 && p[0] < W + 12 && p[1] > -12 && p[1] < H + 12) out.head = { x: p[0] - 12, y: p[1] - 12, w: 24, h: 24, op: hs[0].on }; }
  const lit = (t0, dur) => clamp((t - t0) / dur);
  for (const [k, o, op] of [['aur', M.auraeyez.group, 1], ['buggy', M.buggy.group, 1], ['hxk', M.hxkeysair.group, 1], ['cl', M.corelink.group, 1], ['arx', M.arx.group, 1],
    ['word', TXT.word, 0.08 + 0.92 * lit(T.word0, T.wordDur)], ['logo', LOGO, 0.08 + 0.92 * lit(T.logo, T.logoFill)], ['pad', PAD, 1]]) { const b = box(o, op); if (b) out[k] = b; }
  return out;
};
window.__events = () => [
  ['pad', T.padOn], ['shoot', T.aStart], ['arrive', T.aEnd, 'aur'], ['rise', T.aurRise, 'aur'], ['boot', T.aurBoot, 'aur'], ['eyes', T.aurEyes, 'aur'], ['blink', T.aurBlink, 'aur'], ['glance', T.aurGlance, 'aur'],
  ['shoot', T.bStart], ['arrive', T.bEnd, 'lr'], ['rise', T.lrRise, 'lr'], ['drive', T.drive0, 'buggy'], ['brake', T.drive1 - 0.42, 'buggy'], ['stop', T.drive1, 'buggy'],
  ['bus', T.bus0], ['hit', T.hxk, 'hxk'], ['caps', T.hxk + 0.36, 'hxk'], ['hit', T.cl, 'cl'], ['hit', T.arx, 'arx'], ['land', T.arx + 0.74, 'arx'],
  ['shoot', T.l4Start], ['arrive', T.logo, 'logo'], ['word', T.word0, 'word'], ['close', T.close, 'pad'], ['tag', T.tag, 'pad'],
].map(([name, t, who]) => {
  const where = { aur: AUR, lr: LR, hxk: HXK, cl: CL, arx: ARX, logo: { x: LOCK.stemX, z: BASE_Z }, buggy: { x: buggyX(t), z: LR.z }, word: { x: LOCK.textX + LOCK.textW / 2, z: BASE_Z }, pad: LOCK.P0 }[who];
  const hs = headsAt(t), p = where || (hs[0] ? { x: hs[0].x, z: hs[0].z } : { x: LOCK.P0.x, z: LOCK.P0.z });
  const [q] = project(camAt(t), [[p.x, 0, p.z]]);
  return { name, t: +t.toFixed(3), who, pan: +clamp((q[0] - W / 2) / (W / 2), -1, 1).toFixed(3) };
});
// continuous curves for the score, sampled at `rate` Hz: the current's speed on screen and its pan, the buggy's speed
window.__curves = (rate = 240) => {
  const n = Math.round(DUR * rate), cur = [], pan = [], drive = [], dt = 1 / rate;
  for (let i = 0; i < n; i++) {
    const t = i / rate, h0 = headsAt(t), h1 = headsAt(t + dt);
    let v = 0, pn = 0;
    if (h0.length && h1.length) { const [a] = project(camAt(t), [[h0[0].x, 0, h0[0].z]]), [b] = project(camAt(t), [[h1[0].x, 0, h1[0].z]]); v = Math.hypot(b[0] - a[0], b[1] - a[1]) / dt * h0[0].on; pn = clamp((a[0] - W / 2) / (W / 2), -1, 1); }
    cur.push(+v.toFixed(1)); pan.push(+pn.toFixed(3)); drive.push(+(Math.abs(buggyX(t + dt) - buggyX(t)) / dt).toFixed(1));
  }
  return { rate, current: cur, pan, drive, heads: Array.from({ length: n }, (_, i) => headsAt(i / rate).length) };
};

window.__ready = (async () => {
  await build(); addFinalKeys(); grain();
  for (const k of ['tag', 'url']) TXT[k].userData.z0 = TXT[k].position.z;
  window.__meta = { dur: DUR, fps: 30, inFrame: { pad: [0, 0.7], head: [0.75, 1.9], aur: [2.6, 4.0], buggy: [5.6, 7.6], word: [12.0, 15, 'whole'], logo: [12.0, 15, 'whole'] } };
  seek(0); return true;
})();
window.__seek = async t => { await window.__ready; seek(t); return true; };
window.__meta = { dur: DUR, fps: 30 };

if (Q.has('play')) window.__ready.then(() => { const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); });
else if (Q.has('t')) window.__ready.then(() => seek(parseFloat(Q.get('t'))));
</script>
