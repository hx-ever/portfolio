<script>
/* One copper trace, v3 — the v1 film (draft_v1) re-shot in the v2 look (hxstudio-hero), 60 fps.
 * From v1, verbatim: the timeline, the layout, the routes and their colour stops, the camera keys and curves, every
 * device's animation, the current's heads. From v2: the renderer (linear HDR → bloom on emissives, DOF on close-ups,
 * ACES, sRGB, vignette, grain), the light rig, the board, the device materials, the courtyard outlines, the type.
 * Flat graphics are authored in display colours and pre-inverted through ACES so they land exactly. __seek(t) is pure. */
const { clamp, lerp, seg, sstep, spring, ring, ease } = OM;
const SETTLE = OM.bezier(0.16, 1, 0.3, 1);
const Q = new URLSearchParams(location.search);
const W = 1920, H = 1080, DUR = 15, FOV = 30, EXPOSURE = 1.0;
const ACC = { auraeyez: '#D89E64', landrover: '#83C25D', hxkeysair: '#51BEC8', corelink: '#917EDD', arx: '#DC7482' };   // v1's accents
const COPPER = '#D89E64', LOGO_ORANGE = '#F7931E', LOGO_YELLOW = '#FFE21F';
const PAL = { bg: '#0A0908', lift: '#15110D', off: '#2A1E15', trace: '#C8813F', hi: '#FFD39A', core: '#FFF1DC', name: '#F5F3EF',
  sub: '#D09860', url: '#808078', label: '#787878', silk: '#CFC9BF' };

// ─────────────────────────────── timeline (v1) ───────────────────────────────
const T = {
  padOn: 0.15, aStart: 0.70, aEnd: 1.95,
  aurRise: 2.24, aurBoot: 2.52, aurEyes: 2.82, aurBlink: 3.70, aurGlance: 3.90,
  bStart: 4.06, bEnd: 4.84,
  lrRise: 5.08, drive0: 6.04, drive1: 7.40,
  bus0: 7.42, busV: 1420, busC: 0.11,
  l4Start: 10.42, logoFill: 0.40, wordDur: 0.68,
};

// ─────────────────────────────── layout (mm, v1) ───────────────────────────────
const AUR = { x: 430, z: -190, w: 74.041, h: 85.5218 };
const LR = { x: 70, z: -205, w: 124.9934, h: 74.803 };
const HXK = { x: -400, z: 205, w: 76.2762, h: 96.3676 };
const CL = { x: -20, z: 222, w: 132, h: 58 };
const ARX = { x: 320, z: 212, w: 128, h: 96 };
const JX = -330;                                  // where the buggy brakes; the bus leaves from under it
const FONT_MM = 74, BASE_Z = 26;                  // wordmark size and baseline
let LOCK;                                         // measured in __ready: logo + wordmark + period pad

// ─────────────────────────────── renderer, light rig, studio (v2) ───────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.toneMapping = THREE.NoToneMapping; renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap; renderer.shadowMap.autoUpdate = false;
const scene = new THREE.Scene(); scene.background = null;
const camera = new THREE.PerspectiveCamera(FOV, W / H, 4, 20000);

// a dark studio for reflections only: black room, a top-left softbox, a warm strip behind-right, a faint cool fill
(() => {
  const env = new THREE.Scene(), box = new THREE.Mesh(new THREE.BoxGeometry(10, 10, 10), new THREE.MeshBasicMaterial({ color: '#050404', side: THREE.BackSide }));
  env.add(box);
  const panel = (w, h, col, k, pos, look) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(k), side: THREE.DoubleSide })); m.position.set(...pos); m.lookAt(...look); env.add(m); };
  panel(5, 4, '#fff6ea', 1.5, [-2.6, 3.6, -2.2], [0, 0, 0]);
  panel(1.6, 5, '#ffb877', 1.8, [3.4, 1.2, -3.0], [0, 0, 0]);
  panel(6, 2.2, '#c4cee0', 0.55, [0, 0.9, 4.6], [0, 0, 0]);
  panel(9, 9, '#3a3430', 0.25, [0, 4.9, 0], [0, 0, 0]);
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(env, 0.02).texture; scene.environmentIntensity = 1.15;
})();
renderer.clippingPlanes = [new THREE.Plane(new THREE.Vector3(0, 1, 0), 0.02)];   // products rise through the board
scene.add(new THREE.AmbientLight('#ffffff', 0.05));
const key = new THREE.DirectionalLight('#fff4e6', 2.1);                  // soft key, top-left at 45°
key.position.set(-700, 990, -700); scene.add(key, key.target);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 5; key.shadow.bias = -0.0005; key.shadow.normalBias = 0.8;
Object.assign(key.shadow.camera, { left: -820, right: 820, top: 620, bottom: -620, near: 200, far: 3200 }); key.shadow.camera.updateProjectionMatrix();
const rim = new THREE.DirectionalLight('#f0a560', 3.4);                  // warm copper rim from behind-right, ~2× key
rim.position.set(800, 420, -1000); scene.add(rim, rim.target);
const fill = new THREE.DirectionalLight('#c4cee0', 0.55);                // very low cool fill
fill.position.set(-300, 300, 1000); scene.add(fill, fill.target);
const pulseLight = new THREE.PointLight('#ffd39a', 0, 160, 0); pulseLight.position.y = 18; scene.add(pulseLight);

// ─────────────────────────────── colour: display palette → pre-tonemap linear ───────────────────────────────
const IN = new THREE.Matrix3().set(0.59719, 0.35458, 0.04823, 0.07600, 0.90834, 0.01566, 0.02840, 0.13383, 0.83777);
const OUT = new THREE.Matrix3().set(1.60475, -0.53108, -0.07367, -0.10208, 1.10813, -0.00605, -0.00327, -0.07276, 1.07602);
const INI = IN.clone().invert(), OUTI = OUT.clone().invert();
const glm = m => { const e = m.elements; return `mat3(${e.map(v => v.toFixed(8)).join(',')})`; };   // elements are column-major, as GLSL wants
const COLOR_GLSL = `
  vec3 srgb2lin(vec3 c) { return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(0.04045, c)); }
  vec3 lin2srgb(vec3 c) { return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
  vec3 invACES(vec3 y) {                       // display-linear → the value ACES (three's fit, exposure ${EXPOSURE}) maps onto it
    vec3 b = clamp(${glm(OUTI)} * clamp(y, 0.0, 1.0), 0.0, 0.982);
    vec3 A = 1.0 - 0.983729 * b, B = 0.0245786 - 0.432951 * b, C = -(0.000090537 + 0.238081 * b);
    vec3 v = (-B + sqrt(max(B * B - 4.0 * A * C, 0.0))) / (2.0 * A);
    return max(${glm(INI)} * v, 0.0) * 0.6 / ${EXPOSURE.toFixed(3)};
  }
  vec3 pre(vec3 srgb) { return invACES(srgb2lin(srgb)); }`;
const lin = hex => new THREE.Color(hex);                                    // THREE.Color stores linear values
const v3 = hex => { const c = lin(hex); return new THREE.Vector3(c.r, c.g, c.b); };

// ─────────────────────────────── the board (v2) ───────────────────────────────
const GRID = 16.7;
const board = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), new THREE.ShaderMaterial({
  uniforms: { uBg: { value: v3(PAL.bg) }, uLift: { value: v3(PAL.lift) } },
  vertexShader: `varying vec2 vP; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vP = w.xz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `${COLOR_GLSL}
    uniform vec3 uBg, uLift; varying vec2 vP;
    void main(){
      vec2 s = gl_FragCoord.xy / vec2(${W}.0, ${H}.0) - vec2(0.5, 0.53); s.x *= ${(W / H).toFixed(4)};
      vec3 c = mix(uLift, uBg, smoothstep(0.0, 0.85, length(s)));
      vec2 g = mod(vP + ${GRID / 2}, ${GRID}) - ${GRID / 2}; float d = length(g), fw = fwidth(d) * 1.1;
      float dotA = (1.0 - smoothstep(0.75 - fw, 0.75 + fw, d)) * clamp(1.4 - fw * 0.9, 0.0, 1.0);
      c = mix(c, vec3(1.0), 0.04 * dotA);
      gl_FragColor = vec4(invACES(c), 1.0); }`,
}));
board.rotation.x = -Math.PI / 2; scene.add(board);
const shadowCatch = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), new THREE.ShadowMaterial({ opacity: 0.32 }));
shadowCatch.rotation.x = -Math.PI / 2; shadowCatch.position.y = 0.05; shadowCatch.receiveShadow = true; scene.add(shadowCatch);

// ─────────────────────────────── flat layers on the board (v2) ───────────────────────────────
const canvasOf = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
const texOf = c => { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.NoColorSpace; t.anisotropy = 8; t.minFilter = THREE.LinearMipmapLinearFilter; return t; };
const LAYER_FS = `${COLOR_GLSL}
  uniform sampler2D tDim, tLit; uniform vec2 uSize, uOrigin; uniform float uR, uW, uMode, uFront, uAlpha, uGain, uDim; uniform vec3 uFrontCol;
  varying vec2 vUv;
  void main(){
    vec2 p = vUv * uSize; vec4 a = texture2D(tDim, vUv), b = texture2D(tLit, vUv);
    float d = uMode < 0.5 ? length(p - uOrigin) : p.x - uOrigin.x;
    float m = 1.0 - smoothstep(uR - uW, uR, d);
    float front = exp(-pow((d - uR + uW * 0.45) / (uW * 0.55), 2.0)) * uFront * step(0.001, uR);
    vec4 c = mix(a, b, m);
    vec3 col = pre(c.rgb * uDim) * uGain + pre(uFrontCol) * front * 2.5 * max(a.a, b.a);
    gl_FragColor = vec4(col, max(c.a, front * max(a.a, b.a)) * uAlpha); }`;
function layer(dim, lit, wmm, hmm, frontHex = PAL.hi) {
  const mat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false,
    uniforms: { tDim: { value: texOf(dim) }, tLit: { value: texOf(lit) }, uSize: { value: new THREE.Vector2(wmm, hmm) }, uOrigin: { value: new THREE.Vector2() },
      uR: { value: 0 }, uW: { value: 8 }, uMode: { value: 0 }, uFront: { value: 1 }, uAlpha: { value: 0 }, uGain: { value: 1 }, uDim: { value: 1 }, uFrontCol: { value: fc(frontHex) } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: LAYER_FS });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(wmm, hmm), mat);
  m.rotation.x = -Math.PI / 2; m.renderOrder = 2;
  m.toLocal = (bx, bz) => [bx - (m.position.x - wmm / 2), (m.position.z + hmm / 2) - bz];
  m.u = mat.uniforms; scene.add(m); return m;
}
const fc = hex => { const c = new THREE.Color(); c.setStyle(hex, THREE.NoColorSpace); return c; };   // a display colour, unconverted
async function svgCanvas(svg, w, h) { const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); await img.decode(); const c = canvasOf(w, h); c.getContext('2d').drawImage(img, 0, 0, w, h); return c; }
const recolor = (svg, map) => Object.entries(map).reduce((s, [a, b]) => s.split(a).join(b).split(a.toLowerCase()).join(b), svg);
const mixHex = (a, b, k) => '#' + new THREE.Color(a).lerp(new THREE.Color(b), k).getHexString();
function stripText(svg, drop) {                // remove KiCad stroked-text groups by their <desc>
  const doc = new DOMParser().parseFromString(svg, 'image/svg+xml');
  for (const g of [...doc.querySelectorAll('g')]) { const d = g.querySelector(':scope > desc'); if (d && drop.includes(d.textContent.trim())) g.remove(); }
  for (const t of [...doc.querySelectorAll('text')]) if (drop.includes(t.textContent.trim())) t.remove();
  return new XMLSerializer().serializeToString(doc);
}
// text in display colours; returns the canvas and its metrics in mm
function textCanvas(str, font, mm, color, { px = 10, spacing = 0, pad = 3 } = {}) {
  const g0 = canvasOf(8, 8).getContext('2d'); g0.font = font(mm * px); g0.letterSpacing = `${spacing * mm * px}px`;
  const mt = g0.measureText(str), P = pad * px, asc = Math.ceil(mt.actualBoundingBoxAscent), desc = Math.ceil(Math.max(2, mt.actualBoundingBoxDescent));
  const c = canvasOf(mt.width + P * 2, asc + desc + P * 2), g = c.getContext('2d');
  g.font = font(mm * px); g.letterSpacing = `${spacing * mm * px}px`; g.fillStyle = color; g.textBaseline = 'alphabetic'; g.fillText(str, P, P + asc);
  return { c, w: c.width / px, h: c.height / px, textW: mt.width / px, pad: P / px, asc: asc / px, px, ctx: g0 };
}
const placeText = (m, T0, x, z) => m.position.set(x - T0.pad + T0.w / 2, 0.12, z - (T0.pad + T0.asc) + T0.h / 2);

// ─────────────────────────────── traces (v1 geometry, v2 shading) ───────────────────────────────
// A route is corner points plus a fillet radius per corner, sampled every 0.6 mm; drawn as a ribbon whose drawRange
// is the revealed length, with a soft additive halo and a vertex-colour gradient along it.
function route(pts, radii) {
  const P = pts.map(([x, z]) => new THREE.Vector2(x, z)), out = [P[0].clone()];
  const arcTo = (A, B, c, r) => {
    let a0 = Math.atan2(A.y - c.y, A.x - c.x), a1 = Math.atan2(B.y - c.y, B.x - c.x), da = a1 - a0;
    while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
    const n = Math.max(2, Math.ceil(Math.abs(da) * r / 0.6));
    for (let i = 1; i <= n; i++) { const a = a0 + da * i / n; out.push(new THREE.Vector2(c.x + r * Math.cos(a), c.y + r * Math.sin(a))); }
  };
  const lineTo = B => { const A = out[out.length - 1], L = A.distanceTo(B), n = Math.max(1, Math.ceil(L / 0.6)); for (let i = 1; i <= n; i++) out.push(A.clone().lerp(B, i / n)); };
  for (let i = 1; i < P.length - 1; i++) {
    const u = P[i].clone().sub(P[i - 1]).normalize(), v = P[i + 1].clone().sub(P[i]).normalize();
    const turn = Math.acos(clamp(u.dot(v), -1, 1)), r = (Array.isArray(radii) ? radii[i - 1] : radii) || 0;
    if (turn < 1e-3 || r <= 0) { lineTo(P[i]); continue; }
    const td = r * Math.tan(turn / 2), A = P[i].clone().addScaledVector(u, -td), B = P[i].clone().addScaledVector(v, td);
    const cross = u.x * v.y - u.y * v.x, perp = new THREE.Vector2(-u.y, u.x).multiplyScalar(cross > 0 ? r : -r);
    lineTo(A); arcTo(A, B, A.clone().add(perp), r);
  }
  lineTo(P[P.length - 1]);
  const cum = [0]; for (let i = 1; i < out.length; i++) cum.push(cum[i - 1] + out[i].distanceTo(out[i - 1]));
  return { pts: out, cum, L: cum[cum.length - 1] };
}
function at(R, s) {
  s = clamp(s, 0, R.L); let lo = 0, hi = R.cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (R.cum[m] <= s) lo = m; else hi = m; }
  const k = (s - R.cum[lo]) / Math.max(1e-6, R.cum[hi] - R.cum[lo]);
  return { x: lerp(R.pts[lo].x, R.pts[hi].x, k), z: lerp(R.pts[lo].y, R.pts[hi].y, k), i: lo };
}
// The core is the stop colour exactly (pre-inverted, anti-aliased edges); the halo adds 0.2 of it in display space.
const RIBBON_VS = `attribute vec3 aCol; attribute float aV; varying vec3 vC; varying float vV;
  void main(){ vC = aCol; vV = aV; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const RIBBON_CORE = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, side: THREE.DoubleSide, vertexShader: RIBBON_VS,
  fragmentShader: `${COLOR_GLSL} varying vec3 vC; varying float vV;
    void main(){ float e = 1.0 - smoothstep(0.62, 1.0, abs(vV)); gl_FragColor = vec4(invACES(vC), e); }` });
const RIBBON_HALO = (op) => new THREE.ShaderMaterial({ transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, vertexShader: RIBBON_VS,
  uniforms: { uOp: { value: op } },
  fragmentShader: `${COLOR_GLSL} uniform float uOp; varying vec3 vC; varying float vV;
    void main(){ float e = 1.0 - smoothstep(0.55, 1.0, abs(vV)); gl_FragColor = vec4(pre(uOp * lin2srgb(vC)) * e, 1.0); }` });
function ribbon(R, width, colorAt, { y = 0.14, halo = 7.5, haloOp = 0.2 } = {}) {
  const n = R.pts.length, mk = (w) => {
    const pos = new Float32Array(n * 6), col = new Float32Array(n * 6), side = new Float32Array(n * 2), idx = [];
    for (let i = 0; i < n; i++) {
      const a = R.pts[Math.max(0, i - 1)], b = R.pts[Math.min(n - 1, i + 1)];
      let tx = b.x - a.x, tz = b.y - a.y; const l = Math.hypot(tx, tz) || 1; tx /= l; tz /= l;
      const nx = -tz * w / 2, nz = tx * w / 2, p = R.pts[i], c = colorAt(R.cum[i] / R.L);
      pos.set([p.x + nx, y, p.y + nz, p.x - nx, y, p.y - nz], i * 6); col.set([c.r, c.g, c.b, c.r, c.g, c.b], i * 6); side.set([1, -1], i * 2);
      if (i < n - 1) idx.push(2 * i, 2 * i + 1, 2 * i + 2, 2 * i + 1, 2 * i + 3, 2 * i + 2);
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('aCol', new THREE.BufferAttribute(col, 3)); g.setAttribute('aV', new THREE.BufferAttribute(side, 1)); g.setIndex(idx); return g;
  };
  const core = new THREE.Mesh(mk(width), RIBBON_CORE);
  const glow = new THREE.Mesh(mk(halo), RIBBON_HALO(haloOp));
  core.renderOrder = 3; glow.renderOrder = 2; glow.position.y = -0.02;
  scene.add(glow, core);
  return { R, core, glow, set(s0, s1) {
    const i0 = s1 <= s0 ? 0 : at(R, s0).i, i1 = s1 <= s0 ? 0 : Math.min(n - 1, at(R, s1).i + 1), c = Math.max(0, i1 - i0) * 6;
    core.geometry.setDrawRange(i0 * 6, c); glow.geometry.setDrawRange(i0 * 6, c); core.visible = glow.visible = c > 0;
  } };
}
const gradient = (...stops) => k => {
  const n = stops.length - 1, i = Math.min(n - 1, Math.floor(k * n)), f = k * n - i;
  return new THREE.Color(stops[i]).lerp(new THREE.Color(stops[i + 1]), clamp(f));
};
// The current: v1's radial falloff in the trace colour (additive, display space) around a white-hot emissive core.
function glowDecal(size, color, { y = 0.3, hot = 0 } = {}) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uC: { value: v3(color) }, uOp: { value: 0 }, uHot: { value: hot } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `${COLOR_GLSL} uniform vec3 uC; uniform float uOp, uHot; varying vec2 vUv;
      float prof(float r){ return r < 0.12 ? mix(1.0, 0.85, r / 0.12) : r < 0.35 ? mix(0.85, 0.25, (r - 0.12) / 0.23) : mix(0.25, 0.0, clamp((r - 0.35) / 0.65, 0.0, 1.0)); }
      void main(){
        float r = length(vUv - 0.5) * 2.0, g = prof(r) * uOp, h = exp(-r * r / 0.006) * uOp * uHot;
        vec3 c = pre(clamp(lin2srgb(uC) * g + vec3(h * 0.9), 0.0, 1.0)) + vec3(h * 9.0);
        gl_FragColor = vec4(c, 1.0); }` }));
  m.rotation.x = -Math.PI / 2; m.position.y = y; m.renderOrder = 4; m.u = m.material.uniforms;
  m.setColor = hex => m.u.uC.value.copy(v3(hex)); scene.add(m); return m;
}
const heads = [0, 1, 2, 3].map(() => glowDecal(30, COPPER, { hot: 1 }));

// a silkscreen loop (v2's courtyard outline): a strip with anti-aliased edges, drawn in by length
function outline(R, width = 0.7, y = 0.11) {
  const n = R.pts.length, pos = new Float32Array(n * 6), aS = new Float32Array(n * 2), aV = new Float32Array(n * 2), idx = [];
  for (let i = 0; i < n; i++) {
    const a = R.pts[Math.max(0, i - 1)], b = R.pts[Math.min(n - 1, i + 1)]; let tx = b.x - a.x, tz = b.y - a.y; const l = Math.hypot(tx, tz) || 1; tx /= l; tz /= l;
    const nx = -tz * width / 2, nz = tx * width / 2, p = R.pts[i];
    pos.set([p.x + nx, y, p.y + nz, p.x - nx, y, p.y - nz], i * 6); aS.set([R.cum[i], R.cum[i]], i * 2); aV.set([1, -1], i * 2);
    if (i < n - 1) idx.push(2 * i, 2 * i + 1, 2 * i + 2, 2 * i + 1, 2 * i + 3, 2 * i + 2);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('aS', new THREE.BufferAttribute(aS, 1));
  g.setAttribute('aV', new THREE.BufferAttribute(aV, 1)); g.setIndex(idx);
  const mat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, side: THREE.DoubleSide,
    uniforms: { uDraw: { value: 1e9 }, uDim: { value: 0.55 }, uC: { value: v3(PAL.silk) } },
    vertexShader: `attribute float aS; attribute float aV; varying float vS; varying float vV; void main(){ vS = aS; vV = aV; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `${COLOR_GLSL} uniform float uDraw, uDim; uniform vec3 uC; varying float vS; varying float vV;

// ─────────────────────────────── end-card camera helpers ───────────────────────────────
const scratch = new THREE.PerspectiveCamera(FOV, W / H, 4, 20000);

  placeCamera(scratch, c); const r = new THREE.Raycaster(); r.setFromCamera(new THREE.Vector2(px / W * 2 - 1, 1 - py / H * 2), scratch);
  const hit = new THREE.Vector3(); r.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit); return { x: hit.x, z: hit.z };
}
function toScreen(c, x, y, z) { placeCamera(scratch, c); const v = new THREE.Vector3(x, y, z).project(scratch); return [(v.x + 1) * W / 2, (1 - v.y) * H / 2]; }

function busLane(o, peel) {
  // left from under the braked buggy, down the board's left side, right under the wordmark, then peel off
  const zh = 125 - o, xv = -470 + o, pts = [[JX + 30, LR.z + o], [xv, LR.z + o], [xv, zh], [peel.x, zh], [peel.x, peel.z]];
  return route(pts, [40 - o, 40 - o, 10]);
}
const busS = tau => tau <= 0 ? 0 : T.busV * (tau - T.busC * (1 - Math.exp(-tau / T.busC)));   // soft start, then a steady race
function busT(s) { let lo = 0, hi = 5; for (let i = 0; i < 50; i++) { const m = (lo + hi) / 2; if (busS(m) < s) lo = m; else hi = m; } return hi; }

function footprintArt(kind, w, h) {
  const PX = 14, mk = col => {
    const c = canvasOf(w * PX, h * PX), g = c.getContext('2d'), u = PX; g.lineCap = 'round'; g.lineJoin = 'round';
    const pad = (x, y, r = 0.9) => { g.fillStyle = col.cu; g.beginPath(); g.arc(x * u, y * u, r * u, 0, 7); g.fill(); g.fillStyle = '#0A0908'; g.beginPath(); g.arc(x * u, y * u, r * 0.42 * u, 0, 7); g.fill(); };
    const line = (pts, wd = 0.6, c2 = col.cu) => { g.strokeStyle = c2; g.lineWidth = wd * u; g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x * u, y * u) : g.moveTo(x * u, y * u))); g.stroke(); };
    g.strokeStyle = col.edge; g.lineWidth = 0.25 * u; g.strokeRect(1 * u, 1 * u, (w - 2) * u, (h - 2) * u);
    if (kind === 'cl') {
      for (let i = 0; i < 12; i++) { pad(14 + i * 8.6, 8); pad(14 + i * 8.6, h - 8); }
      for (let i = 0; i < 12; i += 2) line([[14 + i * 8.6, 8], [14 + i * 8.6, 15], [22 + i * 8.6, 22], [22 + i * 8.6, h - 15], [14 + i * 8.6, h - 8]], 0.5, col.cu2);
      g.strokeStyle = col.silk; g.lineWidth = 0.3 * u; g.beginPath(); g.arc(w * 0.3 * u, h / 2 * u, 8 * u, 0, 7); g.stroke(); g.beginPath(); g.arc(w * 0.7 * u, h / 2 * u, 8 * u, 0, 7); g.stroke();
    } else {

      g.strokeStyle = col.silk; g.lineWidth = 0.3 * u;
      for (const [sx, sy] of [[1, 1], [-1, -1], [1, -1], [-1, 1]]) { g.beginPath(); g.arc((cx + sx * 35.4) * u, (cy + sy * 30) * u, 16 * u, 0, 7); g.stroke(); }

}

// A soft contact shadow under a device: its lowest 26 mm seen from above, max-blended, blurred twice; black on the board.
function bakeContact(m, wmm, hmm) {
  const S = 256, rtA = new THREE.WebGLRenderTarget(S, S), rtB = new THREE.WebGLRenderTarget(S, S);
  const g = m.group, saved = g.position.clone(); g.position.set(0, 0, 0); g.updateMatrixWorld(true);
  const tmp = new THREE.Scene(); tmp.add(g);
  const cam = new THREE.OrthographicCamera(-wmm / 2 * 1.25, wmm / 2 * 1.25, hmm / 2 * 1.25, -hmm / 2 * 1.25, 1, 2000);
  cam.position.set(0, 1000, 0); cam.up.set(0, 0, -1); cam.lookAt(0, 0, 0);
  tmp.overrideMaterial = new THREE.ShaderMaterial({ depthTest: false, depthWrite: false, blending: THREE.CustomBlending, blendEquation: THREE.MaxEquation,
    vertexShader: `varying float vY; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vY = w.y; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `varying float vY; void main(){ float k = 1.0 - smoothstep(0.0, 26.0, vY); gl_FragColor = vec4(k * k, 0.0, 0.0, 1.0); }` });
  const prevClear = renderer.getClearColor(new THREE.Color()), prevA = renderer.getClearAlpha();
  renderer.setClearColor(0x000000, 1); renderer.setRenderTarget(rtA); renderer.clear(); renderer.render(tmp, cam);
  const blur = (src, dst, dir) => { POST.blurMat.uniforms.tSrc.value = src.texture; POST.blurMat.uniforms.uDir.value.set(dir[0] / S, dir[1] / S); POST.quad.material = POST.blurMat; renderer.setRenderTarget(dst); renderer.render(POST.qscene, POST.qcam); };
  for (const r of [3.5, 2.0]) { blur(rtA, rtB, [r, 0]); blur(rtB, rtA, [0, r]); }
  renderer.setRenderTarget(null); renderer.setClearColor(prevClear, prevA);
  scene.add(g); g.position.copy(saved); g.updateMatrixWorld(true);
  const mat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, uniforms: { tC: { value: rtA.texture }, uA: { value: 0 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform sampler2D tC; uniform float uA; varying vec2 vUv; void main(){ float k = texture2D(tC, vUv).r; gl_FragColor = vec4(0.0, 0.0, 0.0, clamp(k * 1.25, 0.0, 0.85) * uA); }` });
  const p = new THREE.Mesh(new THREE.PlaneGeometry(wmm * 1.25, hmm * 1.25), mat); p.rotation.x = -Math.PI / 2; p.renderOrder = 1; p.u = mat.uniforms;
  scene.add(p); return p;
}

async function build() {

  LOGO.u.uW.value = 22;

  // subtitle, v2's one line: "— Product Engineer │ hankhsu.com", mono 24 px, +4 % tracking, from the name's left edge

  const urlT = textCanvas('hankhsu.com', px => `500 ${px}px FilmMono`, monoMM, PAL.url, { px: 16, spacing: 0.04 });
  probe.font = `500 100px FilmMono`; const capM = probe.measureText('P').actualBoundingBoxAscent / 100 * monoMM;

  for (const [p, dt, op] of [[SUB, 0, 1], [DIV, 0.12, 0.3], [URL, 0.12, 1]]) {

  const blink = 1 - (t >= T.aurBlink && t < T.aurBlink + 0.16 ? Math.sin(Math.PI * seg(t, T.aurBlink, T.aurBlink + 0.16)) * 0.94 : 0);

}
let LAST_T = 0, SHADOW_SIG = '';

// ─────────────────────────────── contract ───────────────────────────────
function project(c, pts) { placeCamera(scratch, c); return pts.map(p => { const v = new THREE.Vector3(p[0], p[1] || 0, p[2]).project(scratch); return [(v.x + 1) * W / 2, (1 - v.y) * H / 2, v.z]; }); }
function movers(t) {

    [AUR.x, rise(t, T.aurRise, M.auraeyez.size.y) + 47, AUR.z],
    [HXK.x, rise(t, T.hxk + 0.03, M.hxkeysair.size.y, 0.55, 16) + 80, HXK.z], [CL.x, rise(t, T.cl + 0.03, M.corelink.size.y, 0.6, 14) + 104, CL.z],

window.__motion = (t0, t1) => {
  const c0 = camAt(t0), c1 = camAt(t1), grid = [];
  for (const fx of [0.1, 0.5, 0.9]) for (const fy of [0.15, 0.5, 0.85]) {
    placeCamera(scratch, c0); const ray = new THREE.Raycaster(); ray.setFromCamera(new THREE.Vector2(fx * 2 - 1, 1 - fy * 2), scratch);
    const hit = new THREE.Vector3(); if (ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit)) grid.push([hit.x, 0, hit.z]);
  }

};
window.__track = () => {

  const box = (obj, op = 1) => {
    if (!obj || !obj.visible || op <= 0.01) return null; const b = new THREE.Box3().setFromObject(obj); if (b.isEmpty()) return null;
    const P = [];

      const v = new THREE.Vector3(x, Math.max(y, 0), z).project(camera); if (v.z < -1 || v.z > 1) return null; P.push([(v.x + 1) * W / 2, (1 - v.y) * H / 2]); }

    ['word', NAME, lit(T.word0, T.wordDur)], ['logo', LOGO, t >= T.logo ? 0.08 + 0.92 * lit(T.logo, T.logoFill) : 0], ['pad', PAD, 1]]) { const b = box(o, op); if (b) out[k] = b; }

};
window.__events = () => [
  ['pad', T.padOn], ['shoot', T.aStart], ['arrive', T.aEnd, 'aur'], ['rise', T.aurRise, 'aur'], ['boot', T.aurBoot, 'aur'], ['eyes', T.aurEyes, 'aur'], ['blink', T.aurBlink, 'aur'], ['glance', T.aurGlance, 'aur'],
  ['shoot', T.bStart], ['arrive', T.bEnd, 'lr'], ['rise', T.lrRise, 'lr'], ['drive', T.drive0, 'buggy'], ['brake', T.drive1 - 0.42, 'buggy'], ['stop', T.drive1, 'buggy'],
  ['bus', T.bus0], ['hit', T.hxk, 'hxk'], ['caps', T.hxk + 0.36, 'hxk'], ['hit', T.cl, 'cl'], ['hit', T.arx, 'arx'], ['land', T.arx + 0.62, 'arx'],
  ['shoot', T.l4Start], ['arrive', T.logo, 'logo'], ['word', T.word0, 'word'], ['close', T.close, 'pad'], ['tag', T.tag, 'pad'],

window.__curves = (rate = 240) => {
  const n = Math.round(DUR * rate), cur = [], pan = [], drive = [], dt = 1 / rate;

window.__meta = { dur: DUR, fps: 60 };
window.__ready = (async () => {
  await build(); addFinalKeys();
  window.__meta = { dur: DUR, fps: 60, inFrame: { pad: [0, 0.7], head: [0.75, 1.9], aur: [2.6, 4.0], buggy: [5.6, 7.6], word: [12.1, 15, 'whole'], logo: [11.6, 15, 'whole'] } };
